name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: "load deps"
      run: caps --strict --ci

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        if ! git diff --exit-code --quiet -- calcit.cirru; then
          echo '::error file=calcit.cirru::Snapshot is not canonical. With the version declared in deps.cirru, run calcit calcit.cirru edit format and inspect definitions through calcit query def.'
          exit 1
        fi
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit calcit.cirru test --require-match --summary-only --format json

    - name: "test"
      run: env=ci calcit calcit.cirru

name: Tests

on:
  push:
    branches:
      - main
      - prepare/stir-source031
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: "load deps"
      run: caps --strict --ci

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        node prepare-source.mjs
        calcit calcit.cirru edit format
        test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'
        calcit calcit.cirru test --require-match --summary-only --format json

    - name: "test"
      run: |
        set -euo pipefail
        env=ci calcit calcit.cirru | tee acceptance/demo.txt
        calcit eval --dep "$GITHUB_WORKSPACE/calcit.cirru" --stdin < acceptance/resources.cirru

    - name: Preserve prepared source and original native rendering
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: stir-source-prepared
        path: |
          calcit.cirru
          acceptance/
        retention-days: 3

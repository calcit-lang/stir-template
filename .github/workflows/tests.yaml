name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        version: "0.29.1"
        caps-version: "0.1.1"

    - name: "load deps"
      run: caps --strict --ci

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --check-only \
          --ns 'stir-template.$meta' --ns stir-template.alias --ns stir-template.core \
          --ns stir-template.main --ns stir-template.schema --ns stir-template.ui --summary-only
        calcit calcit.cirru test --require-match --summary-only --format json

    - name: "test"
      run: env=ci calcit calcit.cirru
